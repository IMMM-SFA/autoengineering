[workspace]
authors = ["Cam Bracken <cameron.bracken@pm.me>"]
channels = ["conda-forge"]
name = "autoengineering"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest tests -q -p no:cacheprovider"
lint = "ruff check --no-cache src tests examples"
test-bayes = "python -m pytest tests -q -p no:cacheprovider"

[dependencies]
python = "3.12.*"
networkx = ">=3.0"
pyyaml = ">=6.0"
numpy = ">=1.24"
pandas = ">=2.0"
click = ">=8.0"
rich = ">=13.0"
pytest = ">=7.0"
pip = "*"
ruff = "*"
requests = ">=2.28"
scipy = ">=1.10"

[pypi-dependencies]
autoengineering = { path = ".", editable = true }

[feature.bayes.dependencies]
botorch = "==0.17.2"
pytorch = ">=2.4"

[feature.bayes.pypi-dependencies]
autoengineering = { path = ".", editable = true }

[environments]
default = { solve-group = "default" }
bayes = { features = ["bayes"], solve-group = "default" }
