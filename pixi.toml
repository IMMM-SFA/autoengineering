[workspace]
authors = ["Cam Bracken <cameron.bracken@pm.me>"]
channels = ["conda-forge"]
name = "autoengineering"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
test = "pytest tests/ --junitxml=results.xml"
lint = "ruff check src/ tests/ examples/"
install = "pip install -e ."

[dependencies]
python = ">=3.11"
networkx = ">=3.0"
pyyaml = ">=6.0"
numpy = ">=1.24"
pandas = ">=2.0"
click = ">=8.0"
rich = ">=13.0"
pytest = ">=7.0"
pip = "*"
ruff = "*"
requests = ">=2.28"
scipy = ">=1.10"
