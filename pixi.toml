[workspace]
authors = ["Cam Bracken <cameron.bracken@pm.me>"]
channels = ["conda-forge"]
name = "autoengineering"
platforms = ["osx-arm64", "linux-64"]
version = "0.2.0"

[tasks]
test = "python -m pytest tests -q -p no:cacheprovider"
lint = "ruff check --no-cache src tests examples"
test-bayes = "python -m pytest tests -q -p no:cacheprovider"
benchmark-partial-network = "python -m autoengineering.benchmarks.partial_network"
benchmark-release-a = "python -m autoengineering.benchmarks.release_a --output benchmarks/release_a/results"
benchmark-full-network = "python -m autoengineering.benchmarks.full_network --output benchmarks/full_network/results"

[dependencies]
python = "3.12.*"
networkx = ">=3.0"
pyyaml = ">=6.0"
numpy = ">=1.24"
pandas = ">=2.0"
click = ">=8.0"
rich = ">=13.0"
pytest = ">=7.0"
pip = "*"
ruff = "==0.15.7"
requests = ">=2.28"
scipy = ">=1.10"

[pypi-dependencies]
autoengineering = { path = ".", editable = true }

[feature.bayes.dependencies]
botorch = "==0.17.2"
pytorch = ">=2.4"
scikit-learn = ">=1.1.2,<1.5"
swig = "*"

[feature.bayes.pypi-dependencies]
autoengineering = { path = ".", editable = true }
smac = ">=2.3,<3"

[environments]
utility = { features = ["optuna", "utility", "wind"] }
interoperability = { features = ["optuna", "interoperability"] }
optuna = { features = ["optuna"] }
solar = { features = ["solar"] }
wind = { features = ["wind"] }
hybrid = { features = ["hybrid"] }
default = { solve-group = "default" }
bayes = { features = ["bayes"], solve-group = "default" }
examples = { features = ["bayes", "real-examples"], solve-group = "default" }

[feature.real-examples.dependencies]
pvlib = "==0.15.0"
bmipy = "==2.0.1"

[feature.solar.pypi-dependencies]
pvlib = "==0.15.2"

[feature.wind.pypi-dependencies]
py-wake = "==2.6.20"
topfarm = "==2.6.2"

[feature.hybrid.pypi-dependencies]
hopp = "==3.4.2"

[feature.hybrid.dependencies]
coin-or-cbc = "*"
glpk = "*"
pandas = ">=2,<3"
timezonefinder = "==6.5.9"

[feature.optuna.pypi-dependencies]
optuna = "==4.5.0"

[feature.interoperability.pypi-dependencies]
psutil = "==7.2.2"
bmipy = "==2.0.1"
openmdao = "==3.41.0"
pvlib = "==0.15.2"

[feature.interoperability.tasks]
test-interoperability = "python -m pytest tests/test_bmi_adapter.py tests/test_openmdao_adapter.py tests/test_optuna_backend.py tests/test_integration_contracts.py tests/test_integration_replay.py tests/test_integration_supervision.py tests/test_integration_evidence.py tests/test_interoperability_identity.py tests/test_circuit_integration.py tests/test_solar_integration.py tests/test_subdaily_contract.py tests/test_optuna_replay_prototype.py -q -p no:cacheprovider"

[feature.utility.pypi-dependencies]
# TOPFARM 2.6.2 requires OpenMDAO 3.39.*. Keep interoperability's 3.41.0 pin separate.
openmdao = "==3.39.0"
pvlib = "==0.15.2"
bmipy = "==2.0.1"
psutil = "==7.2.2"
