[workspace]
authors = ["Cam Bracken <cameron.bracken@pm.me>"]
channels = ["conda-forge"]
name = "autoengineering"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest tests -q -p no:cacheprovider"
lint = "ruff check --no-cache src tests examples"
test-bayes = "python -m pytest tests -q -p no:cacheprovider"
benchmark-partial-network = "python -m autoengineering.benchmarks.partial_network"
benchmark-release-a = "python -m autoengineering.benchmarks.release_a --output benchmarks/release_a/results"
benchmark-full-network = "python -m autoengineering.benchmarks.full_network --output benchmarks/full_network/results"

[dependencies]
python = "3.12.*"
networkx = ">=3.0"
pyyaml = ">=6.0"
numpy = ">=1.24"
pandas = ">=2.0"
click = ">=8.0"
rich = ">=13.0"
pytest = ">=7.0"
pip = "*"
ruff = "==0.15.7"
requests = ">=2.28"
scipy = ">=1.10"

[pypi-dependencies]
autoengineering = { path = ".", editable = true }

[feature.bayes.dependencies]
botorch = "==0.17.2"
pytorch = ">=2.4"
scikit-learn = ">=1.1.2,<1.5"
swig = "*"

[feature.bayes.pypi-dependencies]
autoengineering = { path = ".", editable = true }
smac = ">=2.3,<3"

[environments]
default = { solve-group = "default" }
bayes = { features = ["bayes"], solve-group = "default" }
examples = { features = ["bayes", "real-examples"], solve-group = "default" }

[feature.real-examples.dependencies]
pvlib = "==0.15.0"
bmipy = "==2.0.1"
