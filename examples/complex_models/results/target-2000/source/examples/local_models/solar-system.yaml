system:
  name: solar
  description: Real models coupled through BMI. See PROTOCOL.md.
  components:
  - name: temperature
    model_type: SolarTemperatureBmi
    description: CSDMS BMI 2.0 scalar component
    inputs:
    - name: irradiance
      direction: in
      data_type: float64
      units: W m-2
    - name: air_temperature
      direction: in
      data_type: float64
      units: degC
    outputs:
    - name: module_temperature
      direction: out
      data_type: float64
      units: degC
    metadata:
      bmi_class: examples.local_models.bmi_components:SolarTemperatureBmi
  - name: dc_power
    model_type: PvWattsDcBmi
    description: CSDMS BMI 2.0 scalar component
    inputs:
    - name: irradiance
      direction: in
      data_type: float64
      units: W m-2
    - name: module_temperature
      direction: in
      data_type: float64
      units: degC
    outputs:
    - name: dc_power
      direction: out
      data_type: float64
      units: kW
    metadata:
      bmi_class: examples.local_models.bmi_components:PvWattsDcBmi
  - name: inverter
    model_type: PvWattsInverterBmi
    description: CSDMS BMI 2.0 scalar component
    inputs:
    - name: dc_power
      direction: in
      data_type: float64
      units: kW
    outputs:
    - name: ac_power
      direction: out
      data_type: float64
      units: kW
    metadata:
      bmi_class: examples.local_models.bmi_components:PvWattsInverterBmi
  connections:
  - source: temperature
    port_from: module_temperature
    target: dc_power
    port_to: module_temperature
  - source: dc_power
    port_from: dc_power
    target: inverter
    port_to: dc_power
