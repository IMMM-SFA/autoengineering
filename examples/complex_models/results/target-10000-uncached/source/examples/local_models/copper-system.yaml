system:
  name: copper
  description: Real models coupled through BMI. See PROTOCOL.md.
  components:
  - name: temperature_basis
    model_type: TemperatureBasisBmi
    description: CSDMS BMI 2.0 scalar component
    inputs:
    - name: temperature
      direction: in
      data_type: float64
      units: K
    outputs:
    - name: scaled_temperature
      direction: out
      data_type: float64
      units: '1'
    metadata:
      bmi_class: examples.local_models.bmi_components:TemperatureBasisBmi
  - name: regression
    model_type: CopperRegressionBmi
    description: CSDMS BMI 2.0 scalar component
    inputs:
    - name: scaled_temperature
      direction: in
      data_type: float64
      units: '1'
    outputs:
    - name: expansion_coefficient
      direction: out
      data_type: float64
      units: source_expansion_units
    metadata:
      bmi_class: examples.local_models.bmi_components:CopperRegressionBmi
  connections:
  - source: temperature_basis
    port_from: scaled_temperature
    target: regression
    port_to: scaled_temperature
