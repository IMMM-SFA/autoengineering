system:
  name: hydro
  description: Real observations and small local models. See PROTOCOL.md.
  components:
  - name: pet
    model_type: pet
    description: pet
    inputs: []
    outputs:
    - name: state
      direction: out
      data_type: array
      units: ''
      description: ''
    metadata:
      configuration:
        pet: hargreaves
        capacity: 100.0
        recession: 0.7
  - name: soil_bucket
    model_type: soil_bucket
    description: soil bucket
    inputs:
    - name: state
      direction: in
      data_type: array
      units: ''
      description: ''
    outputs:
    - name: state
      direction: out
      data_type: array
      units: ''
      description: ''
    metadata: {}
  - name: routing
    model_type: routing
    description: routing
    inputs:
    - name: state
      direction: in
      data_type: array
      units: ''
      description: ''
    outputs:
    - name: state
      direction: out
      data_type: array
      units: ''
      description: ''
    metadata: {}
  connections:
  - source: pet
    target: soil_bucket
    port_from: state
    port_to: state
    description: ''
  - source: soil_bucket
    target: routing
    port_from: state
    port_to: state
    description: ''
