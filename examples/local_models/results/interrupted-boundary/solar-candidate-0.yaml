system:
  name: solar
  description: Real observations and small local models. See PROTOCOL.md.
  components:
  - name: temperature
    model_type: temperature
    description: temperature
    inputs: []
    outputs:
    - name: state
      direction: out
      data_type: array
      units: ''
      description: ''
    metadata:
      configuration:
        temperature: ambient
        heat_loss: 25.0
        loss: 1.0
  - name: dc_power
    model_type: dc_power
    description: dc power
    inputs:
    - name: state
      direction: in
      data_type: array
      units: ''
      description: ''
    outputs:
    - name: state
      direction: out
      data_type: array
      units: ''
      description: ''
    metadata: {}
  - name: inverter
    model_type: inverter
    description: inverter
    inputs:
    - name: state
      direction: in
      data_type: array
      units: ''
      description: ''
    outputs:
    - name: state
      direction: out
      data_type: array
      units: ''
      description: ''
    metadata: {}
  connections:
  - source: temperature
    target: dc_power
    port_from: state
    port_to: state
    description: ''
  - source: dc_power
    target: inverter
    port_from: state
    port_to: state
    description: ''
