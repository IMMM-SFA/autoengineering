name: hydrology-development
components:
  - name: pet
    model_type: evapotranspiration
    inputs:
      - {name: tmean_c, direction: in, units: degC}
      - {name: tmax_c, direction: in, units: degC}
      - {name: tmin_c, direction: in, units: degC}
      - {name: day_of_year, direction: in, units: day}
    outputs:
      - {name: pet, direction: out, units: mm/day}
  - name: soil
    model_type: soil_bucket
    inputs:
      - {name: precip_mm, direction: in, units: mm}
      - {name: pet, direction: in, units: mm/day}
    outputs:
      - {name: excess, direction: out, units: mm}
  - name: routing
    model_type: linear_reservoir
    inputs:
      - {name: excess, direction: in, units: mm}
    outputs:
      - {name: prediction, direction: out, units: mm/day}
connections:
  - {from: pet.pet, to: soil.pet}
  - {from: soil.excess, to: routing.excess}
