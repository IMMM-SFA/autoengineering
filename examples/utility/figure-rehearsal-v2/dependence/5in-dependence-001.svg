    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 205.831272)">99.9% iid paired scenario bootstrap</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 216.633733)">intervals. Frozen task policy is recorded in</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 227.436194)">figure-data.json. Fixed scenario censuses</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 238.238655)">have points only and no population interval.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 249.041116)">These intervals do not describe algorithm</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 259.843577)">repetition variation.</text>
