    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 226.806824)">99.9% iid paired scenario bootstrap intervals. Frozen task policy is</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 237.609285)">recorded in figure-data.json. Fixed scenario censuses have points only</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 248.411746)">and no population interval. These intervals do not describe algorithm</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b4b47" transform="translate(34.563281 259.214207)">repetition variation.</text>
